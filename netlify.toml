[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# `netlify dev` (frontend + /mcp function together) — Vite runs on 5190, see vite.config.ts
[dev]
  targetPort = 5190

# SPA fallback — every route serves index.html (no router yet, but harmless)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
